<!doctype html><html><head><meta name="viewport" content="width=device-width"><title>MangaiMart</title><link rel="stylesheet" href="styles.css"></head><body><header><b>MangaiMart</b><button id="account">Sign in</button></header><main><section><h1>Premium Cotton Saree</h1><h2>Rs. 999</h2><p>Free delivery. Cash on delivery.</p></section><section><h2>Place your order</h2><p id="note">Sign in to fill your details automatically.</p><form id="order"><label>Full name<input name="name" required></label><label>Phone<input name="phone" required></label><label>Email<input name="email" type="email"></label><label>Delivery address<input name="address" required></label><label>City<input name="city" required></label><label>State<input name="state" required></label><label>PIN code<input name="pincode" pattern="[0-9]{6}" required></label><button>Place COD order</button><p id="msg"></p></form></section><section><h2>Shiprocket tracking</h2><p>Order creates a Shiprocket shipment and shows its AWB tracking ID.</p></section></main><div id="modal" hidden><div><button id="close">x</button><h2>Account</h2><button class="tab" data-mode="login">Sign in</button><button class="tab" data-mode="signup">Sign up</button><form id="login"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button>Sign in</button><p></p></form><form id="signup" hidden><label>Full name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Phone<input name="phone" required></label><label>Password<input name="password" type="password" minlength="6" required></label><button>Create account</button><p></p></form></div></div><script src="script.js"></script></body></html>
